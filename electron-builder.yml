appId: dev.local.openwinpatcher
productName: OpenWinPatcher
copyright: Copyright © 2026 Sten Pals
artifactName: ${productName}-Setup-${version}.${ext}
extraMetadata:
    version: 1.0.5
directories:
  output: release/${version}
  buildResources: build

# Only ship the compiled UI, the Electron main process and the icon.
files:
  - dist/**
  - electron/**
  - build/icon.ico
  - package.json

asar: false
compression: normal          # use "maximum" for smaller release builds
npmRebuild: false            # no native modules
electronLanguages: [en-US, et-EE]   # Estonian + English Chromium locales only

# Publishing: needs a provider. Replace owner/repo, and set GH_TOKEN in your environment.
publish:
  provider: github
  owner: YOUR_GITHUB_USERNAME
  repo: YOUR_REPO_NAME
  releaseType: release       # "draft" if you want to review before it goes live

# ------------------------------------------------------------------
# Windows
# ------------------------------------------------------------------
win:
  target:
    - { target: nsis,     arch: [x64] }
    - { target: msi,      arch: [x64] }
  icon: build/icon.ico
  # The app edits the registry and services, so it always needs admin rights.
  requestedExecutionLevel: requireAdministrator
  legalTrademarks: OpenWinPatcher

# ------------------------------------------------------------------
# NSIS installer (.exe) - language chooser: English / Eesti
# ------------------------------------------------------------------
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: OpenWinPatcher
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
  multiLanguageInstaller: true
  displayLanguageSelector: true
  installerLanguages: [en_US, et_EE]

# ------------------------------------------------------------------
# MSI installer (.msi, built with WiX)
# ------------------------------------------------------------------
msi:
  oneClick: false
  perMachine: true
  upgradeCode: cbad8f5c-3a0d-4ea7-a74d-96d90498646f
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenWinPatcher
  runAfterFinish: false
  warningsAsErrors: false
  artifactName: ${productName}-Setup-${version}.${ext}

# ------------------------------------------------------------------
# Portable single-file .exe (no install)
# ------------------------------------------------------------------
portable:
  requestExecutionLevel: admin
  artifactName: ${productName}-Portable-${version}.${ext}
